<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Twitch TV</title>
    <style>
        body {
            background-color: #0e0e10;
            color: #efeff1;
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            display: flex;
            flex-direction: column;
            height: 100vh;
            overflow: hidden;
        }
        #login-screen {
            flex: 1;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }
        .btn {
            background-color: #9146FF;
            color: white;
            padding: 15px 30px;
            border: none;
            border-radius: 4px;
            font-size: 1.2rem;
            font-weight: bold;
            cursor: pointer;
            margin-top: 20px;
        }
        .btn:hover { filter: brightness(1.1); }
        #status {
            margin-top: 20px;
            font-family: monospace;
            color: #aaa;
        }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>SmartTwitch TV</h1>
        
        <div id="status">Ready to connect.</div>

        <button id="btn-login" class="btn">Login with Twitch</button>
    </div>

    <script src="main.js"></script>
</body>
</html>
