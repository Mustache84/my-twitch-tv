<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Twitch TV</title>
    <style>
        :root {
            --bg-color: #0e0e10;
            --card-bg: #18181b;
            --text-main: #efeff1;
            --text-dim: #adadb8;
            --accent: #9146FF;
        }
        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Segoe UI', sans-serif;
            margin: 0;
            overflow-x: hidden;
        }

        /* --- LOGIN SCREEN --- */
        #login-screen {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            display: flex; flex-direction: column;
            justify-content: center; align-items: center;
            background: var(--bg-color); z-index: 100;
        }
        .btn {
            background-color: var(--accent); color: white;
            padding: 12px 24px; border: none; border-radius: 4px;
            font-weight: bold; font-size: 1rem; cursor: pointer;
            margin-top: 15px;
        }
        .btn:hover { filter: brightness(1.1); }

        /* --- APP DASHBOARD --- */
        #app-dashboard { display: none; padding: 20px; }
        
        header {
            display: flex; justify-content: space-between; align-items: center;
            margin-bottom: 20px;
        }
        h1 { margin: 0; font-size: 1.5rem; }

        /* --- GRID LAYOUT --- */
        #grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        /* --- STREAM CARD --- */
        .card {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            transition: transform 0.2s, box-shadow 0.2s;
            cursor: pointer;
        }
        .card:hover {
            transform: scale(1.03);
            box-shadow: 0 4px 15px rgba(0,0,0,0.5);
            z-index: 10;
        }
        .thumb {
            width: 100%; aspect-ratio: 16/9;
            background: #000; object-fit: cover;
        }
        .info { padding: 10px; }
        .title {
            font-weight: bold; white-space: nowrap;
            overflow: hidden; text-overflow: ellipsis;
            margin-bottom: 4px;
        }
        .meta { font-size: 0.85rem; color: var(--text-dim); display: flex; justify-content: space-between; }
        .live-tag { color: #eb0400; font-weight: bold; }
    </style>
</head>
<body>

    <div id="login-screen">
        <h1>SmartTwitch TV</h1>
        <div id="login-status" style="color:#aaa; margin-top:10px">Ready.</div>
        <button id="btn-login" class="btn">Login with Twitch</button>
    </div>

    <div id="app-dashboard">
        <header>
            <h1>Live Channels</h1>
            <button id="btn-logout" class="btn" style="background:#333; font-size:0.8rem; padding:8px 16px;">Logout</button>
        </header>
        <div id="grid">
            </div>
    </div>

    <script src="main.js"></script>
</body>
</html>
