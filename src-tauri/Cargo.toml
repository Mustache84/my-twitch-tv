[package]
name = "my-twitch-tv"
version = "0.1.0"
description = "High-performance Twitch Client"
authors = ["you"]
edition = "2021"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
# --- TAURI CORE ---
tauri = { version = "2.0", features = ["tray-icon"] }
tauri-plugin-log = "2.0"
log = "0.4"

# --- DATA ---
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# --- ASYNC & NETWORK ---
tokio = { version = "1", features = ["full"] } 
anyhow = "1.0" 
reqwest = { version = "0.11", features = ["json", "rustls-tls"] }
open = "5.0"              

# --- SECURITY ---
keyring = "2"             

# --- VIDEO ENGINE ---
libmpv = "2.0" 

[features]
custom-protocol = ["tauri/custom-protocol"]
