<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Twitch TV</title>
    <style>
      :root {
        --twitch-purple: #9146FF;
        --bg-dark: #0e0e10;
        --bg-card: #18181b;
        --text-white: #efeff1;
      }
      body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: var(--bg-dark);
        color: var(--text-white);
        margin: 0;
        display: flex;
        flex-direction: column;
        height: 100vh;
        overflow: hidden;
      }
      
      /* Login Screen Overlay */
      #login-screen {
        position: absolute;
        top: 0; left: 0; width: 100%; height: 100%;
        background: rgba(0,0,0,0.9);
        display: flex;
        justify-content: center;
        align-items: center;
        z-index: 100;
      }
      
      .btn {
        background-color: var(--twitch-purple);
        color: white;
        padding: 15px 30px;
        border: none;
        border-radius: 4px;
        font-size: 1.2rem;
        cursor: pointer;
        font-weight: bold;
        transition: transform 0.2s;
      }
      .btn:hover { transform: scale(1.05); filter: brightness(1.1); }
      
      /* Main App (Hidden by default) */
      #app-container {
        display: none;
        padding: 20px;
      }
      
      h1 { margin-top: 0; }
      
      #status-log {
        margin-top: 20px;
        color: #888;
        font-family: monospace;
      }
    </style>
  </head>
  <body>

    <div id="login-screen">
      <div style="text-align: center;">
        <h1>Welcome to SmartTwitch</h1>
        <button id="btn-login" class="btn">Login with Twitch</button>
        <p id="status-log">Waiting for action...</p>
      </div>
    </div>

    <div id="app-container">
      <div style="display:flex; justify-content:space-between; align-items:center;">
        <h1>Live Channels</h1>
        <button id="btn-logout" class="btn" style="background:#444; font-size: 0.9rem;">Logout</button>
      </div>
      <p>Secure connection established.</p>
      </div>

    <script src="main.js"></script>
  </body>
</html>
